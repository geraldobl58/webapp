name: CI/CD Pipeline
run-name: Pipeline CI/CD executed by ${{ github.actor }} in ${{ github.run_number }}

on:
  workflow_call:
    inputs:
      environment-name:
        description: 'Environment name'
        required: true
        type: string
      environment-url:
        description: 'Environment URL'
        required: true
        type: string
      K8S_NAMESPACE:
        description: 'Kubernetes Namespace'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy in Kubernetes
    runs-on: ubuntu-latest

    # Environment Variables
    environment:
      name: ${{ inputs.environment-name }}
      url: ${{ inputs.environment-url }}

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

       # Set Context
      - name: Apply Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_KUBECONFIG }}

      - name: Update Deployment
        run: |
          sed -i 's|namespace: development|namespace: ${{ inputs.K8S_NAMESPACE }}|g' k8s/deployment.yaml
          sed -i 's|namespace: development|namespace: ${{ inputs.K8S_NAMESPACE }}|g' k8s/service.yaml
          sed -i 's|namespace: development|namespace: ${{ inputs.K8S_NAMESPACE }}|g' k8s/ingress.yaml
          sed -i 's|host: development.ogeraldoluiz.com|host: ${{ inputs.environment-url }}|g' k8s/ingress.yaml
          sed -i 's|https://||g' k8s/ingress.yaml

      - name: Create Namespace if Not Exists
        run: |
          kubectl get namespace ${{ inputs.K8S_NAMESPACE }} || kubectl create namespace ${{ inputs.K8S_NAMESPACE }}

        # run: |
        #   sed -i 's/host: development.ogeraldoluiz.com/host:${{ vars.BASE_URL }}/g' k8s/deployment.yaml

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v5
        with:
          namespace: ${{ inputs.K8S_NAMESPACE }}
          manifests: |
            k8s/deployment.yaml
            k8s/service.yaml
            k8s/ingress.yaml
          images: geraldobl58/webapp:v${{ github.run_number }}

  rollback:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action == 'rollback' }}

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Authenticate with Kubernetes
        env:
          KUBECONFIG: ${{ secrets.K8S_KUBECONFIG }}
        run: |
          echo "$KUBECONFIG" > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Check Deployment Status
        run: |
          if ! kubectl rollout status deployment/webapp --namespace=${{ inputs.K8S_NAMESPACE }} --timeout=60s; then
            echo "Deployment is in a bad state. Proceeding with rollback..."
          else
            echo "Deployment is healthy. No rollback needed."
            exit 0
          fi

      - name: Get Deployment Logs
        run: |
          kubectl logs deployment/webapp --namespace=${{ inputs.K8S_NAMESPACE }} || echo "No logs available."

      - name: Rollback Deployment
        run: |
          kubectl rollout undo deployment/webapp --namespace=${{ inputs.K8S_NAMESPACE }}

      - name: Verify Rollback
        run: |
          if ! kubectl rollout status deployment/webapp --namespace=${{ inputs.K8S_NAMESPACE }} --timeout=60s; then
            echo "Rollback failed. Manual intervention required."
            exit 1
          else
            echo "Rollback succeeded."
          fi
