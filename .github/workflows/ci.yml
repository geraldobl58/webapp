name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Continuous Integration (CI)
  CI:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Node.js environment
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      # Cache Node.js dependencies
      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run linting
      - name: Linting
        run: npm run lint

      # Run tests
      - name: Testing
        run: npm run test

      # Build the application
      - name: Build
        run: npm run build

  # Continuous Deployment (CD)
  CD:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup DockerHub credentials
      - name: Setup Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            geraldobl58/webapp:v${{ github.run_number }}
            geraldobl58/webapp:latest

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # Deploy to GitHub Pages using Docker
      - name: Deploy to GitHub Pages
        run: |
          # Create a temporary directory for the build
          mkdir -p ./gh-pages

          # Run the Docker container and copy the build files
          docker run --name temp-container geraldobl58/webapp:latest
          docker cp temp-container:/app/.next ./gh-pages/
          docker cp temp-container:/app/public ./gh-pages/
          docker rm temp-container

          # Create a .nojekyll file to bypass GitHub Pages Jekyll processing
          touch ./gh-pages/.nojekyll

          # Create a simple server.js for GitHub Pages
          cat > ./gh-pages/server.js << 'EOL'
          const { createServer } = require('http');
          const { parse } = require('url');
          const next = require('next');

          const dev = process.env.NODE_ENV !== 'production';
          const app = next({ dev });
          const handle = app.getRequestHandler();

          app.prepare().then(() => {
            createServer((req, res) => {
              const parsedUrl = parse(req.url, true);
              handle(req, res, parsedUrl);
            }).listen(3000, (err) => {
              if (err) throw err;
              console.log('> Ready on http://localhost:3000');
            });
          });
          EOL

          # Deploy to gh-pages branch
          cd gh-pages
          git init
          git add -A
          git commit -m "Deploy to GitHub Pages"
          git push -f https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages

  # Notifications
  Notify:
    needs: [CI, CD]
    runs-on: ubuntu-latest
    steps:
      # Notify on success
      - name: Notify Success
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "✅ CI/CD Pipeline completed successfully!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      # Notify on failure
      - name: Notify Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "❌ CI/CD Pipeline failed. Please check the logs."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
