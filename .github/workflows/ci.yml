name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Continuous Integration (CI)
  CI:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Node.js environment
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      # Cache Node.js dependencies
      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Run linting
      - name: Linting
        run: npm run lint

      # Run tests
      - name: Testing
        run: npm run test

      # Build the application
      - name: Build
        run: npm run build

  # Continuous Deployment (CD)
  CD:
    needs: CI
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup DockerHub credentials
      - name: Setup Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            geraldobl58/webapp:v${{ github.run_number }}
            geraldobl58/webapp:latest

  # Notifications
  Notify:
    needs: [CI, CD]
    runs-on: ubuntu-latest
    steps:
      # Notify on success
      - name: Notify Success via Email
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const issueComment = context.payload.pull_request ? context.payload.pull_request.html_url : context.payload.head_commit.url;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.run_id,
              body: `✅ CI/CD Pipeline completed successfully! Check details: ${issueComment}`
            });

      # Notify on failure
      - name: Notify Failure via Email
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const issueComment = context.payload.pull_request ? context.payload.pull_request.html_url : context.payload.head_commit.url;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.run_id,
              body: `❌ CI/CD Pipeline failed. Please check the logs: ${issueComment}`
            });

